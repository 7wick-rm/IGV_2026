rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_depth: true
    subscribe_rgb: true
    approx_sync: true
    queue_size: 10
    wait_for_transform: 0.5
    use_sim_time: true
    
    
    rtabmap:
      Reg/Strategy: "0"                  
      RGBD/NeighborLinkRefining: "false"  # Refine odometry links
      Grid/FromDepth: "true"             # Create 2D map from depth cloud

